# Generated for CI/CD — before the first deploy you must:
#   1. `flyctl auth login`
#   2. `flyctl apps create ai-medical-voice-agent` (or edit `app` below to a
#      globally-unique name if that one's taken, then match it here)
#   3. Set runtime secrets once: `flyctl secrets set CLERK_SECRET_KEY=... DATABASE_URL=... OPEN_ROUTER_API_KEY=... GROQ_API_KEY=...`
# The CD workflow deploys a pre-built image (from GHCR) on every push to
# main — it does not build on Fly's side, so there's no [build] section.
app = "ai-medical-voice-agent"
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "get"
  path = "/api/health"
  protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
